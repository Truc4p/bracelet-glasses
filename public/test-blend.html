<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #eee; padding: 50px; }
    .container { position: relative; width: 400px; height: 300px; background: white; }
    .img { width: 100%; height: 100%; background: url('/PK002.png') center/contain no-repeat; }
    .overlay { position: absolute; inset: 0; background: rgba(255, 0, 0, 0.5); mix-blend-mode: screen; pointer-events: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="img"></div>
    <div class="overlay"></div>
  </div>
</body>
</html>
